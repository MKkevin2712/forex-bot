[project]
name = "forex-bot"
version = "0.1.0"
description = "Bot de trading forex algorithmique (OANDA / MetaTrader 5) avec backtest, API FastAPI et tableau de bord React"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kevin Moukam Nkameni" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
supabase = ["supabase>=2.0"]

[project.scripts]
forex-bot = "forex_bot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forex_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
